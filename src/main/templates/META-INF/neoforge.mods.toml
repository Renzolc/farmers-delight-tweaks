modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="required"
    versionRange="[1.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="[3.20,)"
    ordering="AFTER"
    side="BOTH"

# The Decrafter and Decrafter Upgrade moved to Disassembly Delight in 1.1.0. Optional, but needed to keep
# existing Decrafters (it maps fd_storage_compat:decrafter onto disassembly_delight:disassembler).
[[dependencies.${mod_id}]]
    modId="disassembly_delight"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"
